name: Build Windows test package
on:
  push:
    branches: [feat/native-pilot, main, codex/thoughtline-acceptance-20261009]
    paths-ignore: ['docs/**', '**.md', 'acceptance/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Source Electron UI regression on Windows
        shell: pwsh
        env:
          THOUGHTLINE_FAKE_CLIPBOARD: '1'
        run: |
          $evidenceRoot = 'acceptance/evidence/round1/p6-windows-source'
          New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
          $runEvidence = Join-Path $evidenceRoot ('run-{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runEvidence | Out-Null
          $env:THOUGHTLINE_EVIDENCE_DIR = $runEvidence
          foreach ($test in @('inline-edit-workflow', 'calendar-workflow', 'calendar-motion-workflow', 'calendar-motion-fix1-workflow', 'calendar-geometry-workflow', 'storage-workflow', 'windows-source-runtime', 'calendar-brand-clip-workflow', 'final-reader-placement-workflow', 'final-calendar-shape-workflow')) {
            $env:THOUGHTLINE_ATTEMPT = ('{0}-windows-ci' -f $test)
            & node "tests/electron/$test.cjs" 2>&1 | Tee-Object -FilePath (Join-Path $runEvidence "$test.log")
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
      - name: Appearance and English source workflow on Windows
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/appearance/windows-source
          THOUGHTLINE_FAKE_CLIPBOARD: '1'
        run: |
          New-Item -ItemType Directory -Force $env:THOUGHTLINE_EVIDENCE_DIR | Out-Null
          & node tests/electron/appearance-workflow.cjs 2>&1 | Tee-Object -FilePath (Join-Path $env:THOUGHTLINE_EVIDENCE_DIR 'workflow.log')
          if ($LASTEXITCODE -ne 0) { throw "Appearance workflow failed: $LASTEXITCODE" }
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Bind package to source and compiled outputs
        run: node scripts/windows-build-manifest.cjs
      - name: Parse user isolation launcher without launching
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'docs/delivery/Start-Thoughtline-Isolated.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          Copy-Item docs/delivery/Start-Thoughtline-Isolated.ps1 dist/Start-Thoughtline-Isolated.ps1
      - name: Disposable runner installation and data retention preflight
        shell: pwsh
        run: ./scripts/windows-installer-preflight.ps1
      - name: Hash test installers
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter '*.exe'
          if ($files.Count -ne 1) { throw 'Expected exactly one x64 installer' }
          $files | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Thoughtline-Windows-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            dist/windows-installed-preflight.json
            dist/windows-installer-preflight.json
            dist/windows-pe-icons.json
            dist/Start-Thoughtline-Isolated.ps1
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Thoughtline-Windows-preflight-failed-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain Windows source UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Thoughtline-Windows-source-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            acceptance/evidence/round1/p6-windows-source/**
            acceptance/evidence/appearance/windows-source/**
            acceptance/evidence/appearance/windows-packaged/**
          if-no-files-found: warn
          retention-days: 30
