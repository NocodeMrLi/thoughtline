name: Build Windows test package
on:
  push:
    branches: [feat/native-pilot, main, codex/thoughtline-acceptance-20261009]
    paths-ignore: ['docs/**', '**.md', 'acceptance/**']
  workflow_dispatch:
    inputs:
      retain_installer:
        description: 'Retain one installer for delivery or failure diagnosis'
        type: boolean
        default: true
      validation_scope:
        description: 'Full validation, or package continuation using recorded unchanged source evidence'
        type: choice
        default: full
        options: [full, package]
permissions:
  contents: read
jobs:
  windows-test-package:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RETAIN_INSTALLER: ${{ (github.event_name == 'workflow_dispatch' && inputs.retain_installer) || contains(github.event.head_commit.message, '[deliver]') }}
    steps:
      - name: Enable long paths for archived evidence on disposable Windows runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Snapshot historical evidence before this run
        run: node scripts/ci-artifact-evidence.cjs snapshot
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Second round UI and real native menu characterization
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'package'
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/round2/windows
          THOUGHTLINE_FAKE_CLIPBOARD: '1'
          THOUGHTLINE_FIXTURE_TRACE: '1'
        run: |
          New-Item -ItemType Directory -Force $env:THOUGHTLINE_EVIDENCE_DIR | Out-Null
          & node scripts/run-ci-fixture.cjs tests/electron/hidden-manage-reopen.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Confirmed hidden Manage reopen failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Second round UI failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-native-menu.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Second round native menu failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-calendar-navigation.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Second round calendar return failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-arrange-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Second round arrangement failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-split-menu-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Second round split menu failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-merge-menu-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Second round merge menu failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round2-capacity-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Capacity and swap workflow failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/positioning-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Tag positioning and effective status workflow failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/title-edit-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Optional title live input regression failed' }
          foreach ($test in @('more-menu-workflow', 'title-only-workflow', 'reminder-workflow')) {
            & node scripts/run-ci-fixture.cjs "tests/electron/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Third round capacity, backfill, layout and platform material
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'package'
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/round3/windows-source
        run: |
          New-Item -ItemType Directory -Force $env:THOUGHTLINE_EVIDENCE_DIR | Out-Null
          foreach ($test in @('round3-layout-workflow','round3-capacity-workflow','round3-material-workflow','round3-window-workflow','round3-refinement-workflow','round3-appearance-workflow','round3-customizer-workflow','round3-reader-recovery-workflow')) {
            & node "tests/electron/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Fourth round rope samples and reader field safety
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/round4/windows-source
        run: |
          & node scripts/run-ci-fixture.cjs tests/electron/round4-visual-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fourth round source visual regression failed' }
          & node scripts/run-ci-fixture.cjs tests/electron/round4-vine-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fourth round source vine drag regression failed' }
          foreach ($test in @('round4-classification-workflow','round4-classification-ui','round5-workflow','round5-readability-workflow','round5-unavailable-workflow','round5-settings-workflow','round5-contact-workflow','round5-export-workflow','round5-group-filter-workflow','round5-filter-ui-workflow','round5-window-workflow','round5-detail-pager-workflow','round5-merge-picker-workflow','round5-stack-workflow','round5-picker-style-workflow')) {
            & node scripts/run-ci-fixture.cjs "tests/electron/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "$test source failed" }
          }
          $env:THOUGHTLINE_EVIDENCE_DIR = 'acceptance/evidence/round4/windows-source-fast-title'
          $env:THOUGHTLINE_FAST_TITLE_UNDO = '1'
          try {
            & node scripts/run-ci-fixture.cjs tests/electron/round5-merge-picker-workflow.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Queued title choice and undo source regression failed' }
          } finally { $env:THOUGHTLINE_FAST_TITLE_UNDO = $null }
      - name: Measured pointer source regression for package continuation
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'package'
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/round4/windows-source-pointer
        run: |
          & node tests/electron/more-menu-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Measured pointer source regression failed' }
      - name: Source Electron UI regression on Windows
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'package'
        shell: pwsh
        env:
          THOUGHTLINE_FAKE_CLIPBOARD: '1'
        run: |
          $evidenceRoot = 'acceptance/evidence/round1/p6-windows-source'
          New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
          $runEvidence = Join-Path $evidenceRoot ('run-{0}-{1}-{2}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runEvidence | Out-Null
          $env:THOUGHTLINE_EVIDENCE_DIR = $runEvidence
          foreach ($test in @('storage-workflow', 'inline-edit-workflow', 'calendar-workflow', 'calendar-motion-workflow', 'calendar-motion-fix1-workflow', 'calendar-geometry-workflow', 'windows-source-runtime', 'calendar-brand-clip-workflow', 'final-reader-placement-workflow', 'final-calendar-shape-workflow')) {
            $env:THOUGHTLINE_ATTEMPT = ('{0}-windows-ci' -f $test)
            & node "tests/electron/$test.cjs" 2>&1 | Tee-Object -FilePath (Join-Path $runEvidence "$test.log")
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
      - name: Appearance and English source workflow on Windows
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'package'
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/appearance/windows-source
          THOUGHTLINE_FAKE_CLIPBOARD: '1'
        run: |
          New-Item -ItemType Directory -Force $env:THOUGHTLINE_EVIDENCE_DIR | Out-Null
          & node tests/electron/appearance-workflow.cjs 2>&1 | Tee-Object -FilePath (Join-Path $env:THOUGHTLINE_EVIDENCE_DIR 'workflow.log')
          if ($LASTEXITCODE -ne 0) { throw "Appearance workflow failed: $LASTEXITCODE" }
      - name: Appearance review fixes on Windows
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'package'
        shell: pwsh
        env:
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/appearance/windows-source/fix-round1
          THOUGHTLINE_FAKE_CLIPBOARD: '1'
        run: |
          New-Item -ItemType Directory -Force $env:THOUGHTLINE_EVIDENCE_DIR | Out-Null
          & node tests/electron/appearance-fix-workflow.cjs 2>&1 | Tee-Object -FilePath (Join-Path $env:THOUGHTLINE_EVIDENCE_DIR 'workflow.log')
          if ($LASTEXITCODE -ne 0) { throw "Appearance review fixes failed: $LASTEXITCODE" }
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Top edge geometry and slow pointer path on Windows
        shell: pwsh
        env:
          THOUGHTLINE_VERIFY: '1'
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/top-edge-20261010/windows-source
        run: |
          & node tests/electron/top-edge-probe.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows source top edge regression failed' }
      - name: Bind package to source and compiled outputs
        run: node scripts/windows-build-manifest.cjs
      - name: Preserve built installer before package validation
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one x64 installer' }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - name: Parse user isolation launcher without launching
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'docs/delivery/Start-Thoughtline-Isolated.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          Copy-Item docs/delivery/Start-Thoughtline-Isolated.ps1 dist/Start-Thoughtline-Isolated.ps1
      - name: Disposable runner installation and data retention preflight
        shell: pwsh
        run: ./scripts/windows-installer-preflight.ps1
      - name: Actual Windows package capacity and menu regression
        shell: pwsh
        env:
          THOUGHTLINE_EXECUTABLE: dist/win-unpacked/Thoughtline.exe
          THOUGHTLINE_EVIDENCE_DIR: acceptance/evidence/round2/windows/packaged-capacity
        run: |
          $env:THOUGHTLINE_EVIDENCE_DIR = 'acceptance/evidence/round3/windows-packaged'
          & node tests/electron/packaged-round3.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Third round actual package regression failed' }
          & node tests/electron/round3-appearance-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual package appearance customization failed' }
          & node tests/electron/round3-customizer-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual package customizer layout and dropdown failed' }
          & node tests/electron/round3-reader-recovery-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual package reader colors and deleted recovery failed' }
          $env:THOUGHTLINE_EVIDENCE_DIR = 'acceptance/evidence/round4/windows-packaged'
          & node tests/electron/round4-visual-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fourth round actual package visual regression failed' }
          & node tests/electron/round4-vine-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Fourth round actual package vine drag regression failed' }
          foreach ($test in @('calendar-workflow','round4-classification-workflow','round4-classification-ui','round5-workflow','round5-readability-workflow','round5-unavailable-workflow','round5-settings-workflow','round5-contact-workflow','round5-export-workflow','round5-group-filter-workflow','round5-filter-ui-workflow','round5-window-workflow','round5-detail-pager-workflow','round5-merge-picker-workflow','round5-stack-workflow','round5-picker-style-workflow')) {
            & node "tests/electron/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "$test actual package failed" }
          }
          $env:THOUGHTLINE_EVIDENCE_DIR = 'acceptance/evidence/round4/windows-packaged-fast-title'
          $env:THOUGHTLINE_FAST_TITLE_UNDO = '1'
          try {
            & node scripts/run-ci-fixture.cjs tests/electron/round5-merge-picker-workflow.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Queued title choice and undo actual package regression failed' }
          } finally { $env:THOUGHTLINE_FAST_TITLE_UNDO = $null }
          $env:THOUGHTLINE_EVIDENCE_DIR = 'acceptance/evidence/round2/windows/packaged-capacity'
          & node tests/electron/packaged-round21.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged reminder/title/More regression failed' }
          & node tests/electron/packaged-capacity.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged capacity regression failed' }
          & node tests/electron/packaged-positioning.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged tag positioning regression failed' }
      - name: Hash test installers
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter '*.exe'
          if ($files.Count -ne 1) { throw 'Expected exactly one x64 installer' }
          $files | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && env.RETAIN_INSTALLER == 'true'
        with:
          name: Thoughtline-Windows-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            dist/windows-installed-preflight.json
            dist/windows-installer-preflight.json
            dist/windows-pe-icons.json
            dist/Start-Thoughtline-Isolated.ps1
          if-no-files-found: error
          retention-days: 7
      - name: Preserve one built installer if delivery validation fails
        if: (failure() || cancelled()) && env.RETAIN_INSTALLER == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Thoughtline-Windows-built-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/build-manifest.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain failed preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Thoughtline-Windows-preflight-failed-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect only this run's new or changed evidence
        if: always()
        run: node scripts/ci-artifact-evidence.cjs collect
      - name: Retain Windows source and package UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Thoughtline-Windows-source-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/ci-evidence/**
          if-no-files-found: warn
          retention-days: 7
