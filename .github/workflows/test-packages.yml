name: Build Windows test package
on:
  push:
    branches: [feat/native-pilot, main, codex/thoughtline-acceptance-20261009]
    paths-ignore: ['docs/**', '**.md', 'acceptance/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Hash test installers
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter '*.exe'
          if ($files.Count -eq 0) { throw 'No installer was built' }
          $files | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Thoughtline-Windows-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
